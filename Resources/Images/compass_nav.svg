<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Compass ring -->
    <circle cx="100" cy="100" r="90" fill="none" stroke="#E0E0E0" stroke-width="2"/>
    
    <!-- Cardinal direction markers -->
    <g font-family="sans-serif" font-size="14" fill="#757575" text-anchor="middle">
        <text x="100" y="20">N</text>
        <text x="180" y="105">E</text>
        <text x="100" y="190">S</text>
        <text x="20" y="105">W</text>
    </g>

    <!-- Direction arrow -->
    <path d="M100,20 L85,170 L100,150 L115,170 Z" 
          fill="#2196F3" 
          transform="rotate(0, 100, 100)"/>
</svg>